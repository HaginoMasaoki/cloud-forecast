name: Daily Cloud Data Fetch

on:
  schedule:
    # JST 深夜0:00 (UTC 15:00) に毎日実行
    - cron: '0 15 * * *'
  workflow_dispatch: # 手動実行も可能にする設定

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Trigger Streamlit Cloud Cache Clearing
        run: |
          echo "Automated daily trigger executed at $(date)" > last_updated.txt

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_updated.txt
          git commit -m "Auto-update forecast data trigger [skip ci]" || exit 0
          git push
